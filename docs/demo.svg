  <text x="560" y="23" fill="#697383" font-size="12" text-anchor="middle">jev — one call, three judgments</text>
  <text xml:space="preserve" x="28" y="60"><tspan fill="#04CA81">$ </tspan><tspan fill="#E5E8EF">jev "결제가 3일째 실패하고 있어요. 환불도 안 되고요. 급합니다." \</tspan></text>
  <text xml:space="preserve" x="28" y="86"><tspan fill="#697383">    --bool  urgent   "시간에 쫓기는 요청인가?" \</tspan></text>
  <text xml:space="preserve" x="28" y="112"><tspan fill="#697383">    --pick  team     "어느 팀이 맡나?" billing=결제·환불 technical=버그·장애 sales=가격 \</tspan></text>
  <text xml:space="preserve" x="28" y="138"><tspan fill="#697383">    --score severity "얼마나 심각한가?" 사소함 불편함 업무정지</tspan></text>
  <text xml:space="preserve" x="28" y="164"></text>
