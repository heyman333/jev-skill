  <text xml:space="preserve" x="28" y="216"><tspan fill="#697383">team</tspan><tspan fill="#697383">           </tspan><tspan fill="#4DA3FF">billing</tspan><tspan fill="#697383">  (100% · technical 0%, sales 0%)</tspan></text>
  <text xml:space="preserve" x="28" y="242"><tspan fill="#697383">severity</tspan><tspan fill="#697383">       </tspan><tspan fill="#4DA3FF">1.53/2</tspan><tspan fill="#697383">  업무정지</tspan></text>
  <text xml:space="preserve" x="28" y="268"><tspan fill="#FFAA33">               ⚠ severity 확신도가 낮습니다. 사람이 보는 게 낫습니다.</tspan></text>
  <text xml:space="preserve" x="28" y="294"><tspan fill="#697383">               574ms · 입력 421 토큰</tspan></text>
